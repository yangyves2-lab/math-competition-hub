services:
  web:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mathhub
      POSTGRES_USER: mathhub
      POSTGRES_PASSWORD: change-this-password
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
