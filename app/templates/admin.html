<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理後台</title><link rel="stylesheet" href="/static/style.css"></head><body><header><div class="brand">∑ 管理後台</div><nav><a href="/">網站</a><a href="/admin/logout">登出</a></nav></header><main><section class="panel"><h1>資料更新</h1><p>手動執行一次搜尋與增量更新。</p><form method="post" action="/admin/run"><button class="primary">立即更新</button></form></section><section class="panel light"><h2>最近更新</h2><table><tr><th>開始</th><th>完成</th><th>新增</th><th>更新</th><th>試題</th><th>錯誤</th></tr>{% for r in runs %}<tr><td>{{r.started_at}}</td><td>{{r.finished_at or '—'}}</td><td>{{r.new_count}}</td><td>{{r.updated_count}}</td><td>{{r.paper_count}}</td><td>{{r.error_count}}</td></tr>{% endfor %}</table></section></main></body></html>
