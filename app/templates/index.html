<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Competition Hub</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><div class="brand">∑ Math Competition Hub</div><nav><a href="/">首頁</a><a href="/admin">管理</a></nav></header>
<main><section class="hero"><div><span class="eyebrow">WEEKLY MATH INTELLIGENCE</span><h1>數學競賽情報站</h1><p>國內外競賽、報名期限、費用、對象、難度與歷屆試題。資料庫持續累積，不因每週更新而覆蓋歷史。</p></div><div class="search"><input id="q" placeholder="搜尋競賽、主辦單位、年級…"><button onclick="load()">搜尋</button></div></section>
<div class="stats" id="stats"></div><div class="filters"><button class="active" onclick="setF('',this)">全部</button><button onclick="setF('台灣',this)">🇹🇼 台灣</button><button onclick="setS('open',this)">🟢 報名中</button><button onclick="setS('upcoming',this)">🟡 即將開始</button><button onclick="setS('closed',this)">🔴 已截止</button></div><section id="cards"></section></main>
<script>
let country='',status='';
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setF(v,b){country=v;status='';document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');load()}
function setS(v,b){status=v;country='';document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');load()}
function label(s){return ({open:'報名中',upcoming:'即將開始',closed:'已截止',unknown:'待確認'})[s]||'待確認'}
async function load(){let q=document.getElementById('q').value;let d=await fetch(`/api/competitions?q=${encodeURIComponent(q)}&country=${encodeURIComponent(country)}&status=${status}`).then(r=>r.json());document.getElementById('cards').innerHTML=d.map(c=>`<article class="card"><div class="row"><span class="tag">${esc(c.country)}</span><span class="status ${c.status}">${label(c.status)}</span></div><h2>${esc(c.name)} <small>${c.year}</small></h2><p class="muted">${esc(c.organizer)}</p><div class="grid"><div><b>報名</b>${esc(c.registration_start||'未公布')} ～ ${esc(c.registration_end||'未公布')}</div><div><b>比賽</b>${esc(c.event_date||'未公布')}</div><div><b>對象</b>${esc(c.target||'未公布')}</div><div><b>費用</b>${esc(c.fee||'未公布')}</div></div><div class="difficulty">難度 ${'★'.repeat(c.difficulty||0)}${'☆'.repeat(5-(c.difficulty||0))}<small>${esc(c.difficulty_note||'')}</small></div><div class="links"><a href="${esc(c.official_url)}" target="_blank" rel="noopener">官方網站 ↗</a>${c.papers.map(p=>`<a href="${esc(p.paper_url)}" target="_blank" rel="noopener">試題 ↗</a>`).join('')}</div></article>`).join('')||'<div class="empty">沒有符合條件的資料。</div>'}
async function stats(){let s=await fetch('/api/stats').then(r=>r.json());document.getElementById('stats').innerHTML=[['競賽',s.competitions],['年度資料',s.editions],['歷屆試題',s.papers],['報名中',s.open]].map(x=>`<div><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join('')}
load();stats();
</script></body></html>
